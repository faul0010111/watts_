# Local WATTS stack.
#
# The reference implementation needs none of this - `python watts.py demo` runs the whole
# pipeline in-process. This compose file exists to develop against the production
# topology: a stream, a time-series store, a policy sidecar and observability.
#
#   make docker-up
#   make docker-down
services:
  redpanda:                      # Kafka API, single binary, no ZooKeeper
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: watts
      POSTGRES_USER: watts
      POSTGRES_PASSWORD: ${WATTS_DB_PASSWORD:?set WATTS_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  opa:
    image: openpolicyagent/opa:1.0.0
    command:
      - run
      - --server
      - --log-level=info
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ../policies:/policies:ro
    ports: ["8181:8181"]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # Uncomment on a host with NVIDIA accelerators to feed real GPU telemetry.
  # dcgm-exporter:
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
  #   cap_add: [SYS_ADMIN]
  #   ports: ["9400:9400"]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  timescale-data:
