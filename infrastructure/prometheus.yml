global:
  scrape_interval: 15s
  external_labels: { stack: watts-local }

scrape_configs:
  - job_name: watts-services
    static_configs: [{ targets: ["host.docker.internal:8080"] }]

  # GPU power needs a fast scrape: LLM serving power swings between prefill bursts and
  # decode steps, and a 15 s scrape averages away the signal WATTS attributes to tokens.
  - job_name: dcgm
    scrape_interval: 1s
    static_configs: [{ targets: ["dcgm-exporter:9400"] }]

  - job_name: opa
    metrics_path: /metrics
    static_configs: [{ targets: ["opa:8181"] }]
