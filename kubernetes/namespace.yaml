apiVersion: v1
kind: Namespace
metadata:
  name: watts
  labels: { name: watts, "pod-security.kubernetes.io/enforce": restricted }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: watts-quota, namespace: watts }
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
---
# Default deny. Every allowed path below is explicit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: watts }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-ingest, namespace: watts }
spec:
  podSelector: { matchLabels: { app: telemetry-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { watts-telemetry: "allowed" } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: redpanda } } }]
      ports: [{ protocol: TCP, port: 9092 }]
    - to: [{ podSelector: { matchLabels: { app: timescaledb } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - ports: [{ protocol: UDP, port: 53 }]
