apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: watts
  labels: { app: dcgm-exporter }
spec:
  selector: { matchLabels: { app: dcgm-exporter } }
  template:
    metadata:
      labels: { app: dcgm-exporter }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        # 1 s scrape: LLM power swings between prefill bursts and decode steps, and a
        # slower interval averages away the structure WATTS attributes to tokens.
        prometheus.io/interval: "1s"
    spec:
      nodeSelector: { "nvidia.com/gpu.present": "true" }
      tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
          ports: [{ containerPort: 9400, name: metrics }]
          env:
            - name: DCGM_EXPORTER_COLLECTORS
              value: /etc/dcgm-exporter/watts-counters.csv
          securityContext:
            capabilities: { add: ["SYS_ADMIN"] }
          volumeMounts: [{ name: counters, mountPath: /etc/dcgm-exporter }]
      volumes:
        - name: counters
          configMap: { name: watts-dcgm-counters }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: watts-dcgm-counters, namespace: watts }
data:
  watts-counters.csv: |
    # The fields WATTS needs. Power and temperature are the energy signal; clock and
    # utilisation separate "throttled" from "idle"; memory bandwidth explains decode cost.
    DCGM_FI_DEV_POWER_USAGE,           gauge, device power draw (W)
    DCGM_FI_DEV_GPU_TEMP,              gauge, GPU temperature (C)
    DCGM_FI_DEV_GPU_UTIL,              gauge, GPU utilisation (%)
    DCGM_FI_DEV_SM_CLOCK,              gauge, SM clock (MHz)
    DCGM_FI_DEV_FB_USED,               gauge, framebuffer used (MiB)
    DCGM_FI_PROF_DRAM_ACTIVE,          gauge, memory bandwidth utilisation
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, total energy since boot (mJ)
